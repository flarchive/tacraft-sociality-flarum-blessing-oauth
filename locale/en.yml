blessing-oauth-client:
  admin:
    popup:
      title: Blessing Skin Login
      field:
        base-url: Blessing Skin root URL
        app-id: OAuth client ID
        app-secret: OAuth client secret
        button-title: Label for login button
        button-title-placeholder: => blessing-oauth-client.api.default-login-button-title
        button-icon: Icon for login button
        button-icon-image: Icon image URL (optional)
        button-icon-image-help: If set (and no icon is uploaded), this image is shown instead of the Font Awesome icon. Leave empty to use the icon class above.
        button-icon-upload: Upload an icon image
        button-icon-upload-help: Upload a local PNG/JPEG/WebP image (max 2 MB). It is used instead of the URL and icon above.
        message-help: Leave empty to use the default translation.
        message-linked: Account linked (success message)
        message-error: Generic login error
        message-error-state: Invalid login state
        message-error-provider: Authorization redirect failed
        message-error-token: Access token request failed
        message-error-userinfo: User profile request failed
        message-error-identifier: Missing user identifier
        verify-ssl: Verify the SSL certificate
        verify-ssl-help: Only disable this when Blessing Skin uses a self-signed certificate. Disabling it lowers security.
  api:
    default-login-button-title: Login with Blessing Skin
  forum:
    linked: Your Blessing Skin account has been linked to your Flarum account.
    link:
      heading: Blessing Skin account
      name: Blessing Skin
      help: Link your Blessing Skin account so you can sign in with it, or remove an existing link.
      status_linked: Linked
      status_unlinked: Not linked
      identifier: "Account ID: {identifier}"
      linked_at: "Linked {time}"
      bind_button: Link Blessing Skin account
      rebind_button: Use a different account
      unbind_button: Remove link
      unlink_confirm: Are you sure you want to remove the link to your Blessing Skin account? It will no longer be linked to this forum account; if the email addresses match, signing in with it again may link it automatically.
      unlinked_success: Your Blessing Skin account has been unlinked.
      unlink_failed: Could not remove the Blessing Skin link. Please try again.
      load_failed: Could not load your Blessing Skin link status. Please try again.
      retry: Try again
    login-error: Could not log in with Blessing Skin. Please try again.
    login-error-state: The login session expired or was opened in another tab. Please try again.
    login-error-provider: Blessing Skin did not authorize the login.
    login-error-token: Blessing Skin did not return an access token. Check the OAuth client ID/secret and the Blessing Skin log.
    login-error-userinfo: Blessing Skin did not return your profile.
    login-error-identifier: Blessing Skin did not return a user ID.
    login-error-already-linked: This Blessing Skin account is already linked to another user.
    login-error-login-required: Please log in before linking a Blessing Skin account.
